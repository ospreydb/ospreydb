name: OspreyDB CI & Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
      - 'pro-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /cargo-cache
  RUSTUP_HOME: /cargo-cache/rustup
  SCCACHE_DIR: /sccache
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  pr-check:
    name: PR Check (check, clippy, release tests)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, osprey-pro-builder]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git access for private ospreydb/osprey-engine crates
        env:
          ENGINE_TOKEN: ${{ secrets.OSPREY_ENGINE_TOKEN || secrets.OSPREY_CORE_TOKEN || env.OSPREY_ENGINE_TOKEN || env.OSPREY_CORE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ENGINE_TOKEN:-}" ]; then
            git config --global --replace-all \
              "url.https://x-access-token:${ENGINE_TOKEN}@github.com/ospreydb/osprey-engine.insteadOf" \
              "https://github.com/ospreydb/osprey-engine"
          else
            echo "::notice::OSPREY_ENGINE_TOKEN / OSPREY_CORE_TOKEN not set; assuming ospreydb/osprey-engine is public or pre-cached."
          fi

      - name: Bootstrap persistent Rust toolchain & sccache
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_HOME}/bin" "${RUSTUP_HOME}" "${SCCACHE_DIR}"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          export PATH="${CARGO_HOME}/bin:${PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --no-modify-path --default-toolchain none
          fi
          rustup show active-toolchain >/dev/null 2>&1 || rustup show

          if ! command -v sccache >/dev/null 2>&1; then
            ARCH="$(uname -m)"
            SCCACHE_VER="v0.10.0"
            curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VER}/sccache-${SCCACHE_VER}-${ARCH}-unknown-linux-musl.tar.gz" \
              | tar -xz --strip-components=1 -C "${CARGO_HOME}/bin" "sccache-${SCCACHE_VER}-${ARCH}-unknown-linux-musl/sccache"
            chmod +x "${CARGO_HOME}/bin/sccache"
          fi

      - name: Cargo fmt check
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Cargo check
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --locked

      - name: Cargo clippy
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cargo test (release)
        run: |
          set -euo pipefail
          cargo test --workspace --release --locked -- --nocapture

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Clean temporary Git credential rewrite
        if: always()
        run: |
          git config --global --name-only --get-regexp '^url\..*github\.com/ospreydb/osprey-engine\.insteadOf$' \
            | xargs -r -n1 git config --global --unset-all || true

  release:
    name: Multi-Arch Build, Distroless GHCR & Release (${{ github.ref_name }})
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/pro-v'))
    runs-on: [self-hosted, osprey-pro-builder]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git access for private ospreydb/osprey-engine crates
        env:
          ENGINE_TOKEN: ${{ secrets.OSPREY_ENGINE_TOKEN || secrets.OSPREY_CORE_TOKEN || env.OSPREY_ENGINE_TOKEN || env.OSPREY_CORE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ENGINE_TOKEN:-}" ]; then
            git config --global --replace-all \
              "url.https://x-access-token:${ENGINE_TOKEN}@github.com/ospreydb/osprey-engine.insteadOf" \
              "https://github.com/ospreydb/osprey-engine"
          else
            echo "::notice::OSPREY_ENGINE_TOKEN / OSPREY_CORE_TOKEN not set; assuming ospreydb/osprey-engine is public or pre-cached."
          fi

      - name: Bootstrap persistent Rust toolchain, sccache, Zig & cargo-zigbuild
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_HOME}/bin" "${RUSTUP_HOME}" "${SCCACHE_DIR}"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          export PATH="${CARGO_HOME}/bin:${PATH}"

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --no-modify-path --default-toolchain none
          fi
          rustup show
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

          ARCH="$(uname -m)"
          if ! command -v sccache >/dev/null 2>&1; then
            SCCACHE_VER="v0.10.0"
            curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VER}/sccache-${SCCACHE_VER}-${ARCH}-unknown-linux-musl.tar.gz" \
              | tar -xz --strip-components=1 -C "${CARGO_HOME}/bin" "sccache-${SCCACHE_VER}-${ARCH}-unknown-linux-musl/sccache"
            chmod +x "${CARGO_HOME}/bin/sccache"
          fi

          if ! command -v zig >/dev/null 2>&1; then
            ZIG_VER="0.14.0"
            rm -rf "${CARGO_HOME}/zig"
            mkdir -p "${CARGO_HOME}/zig"
            curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-${ARCH}-${ZIG_VER}.tar.xz" \
              | tar -xJ --strip-components=1 -C "${CARGO_HOME}/zig"
            ln -sf "${CARGO_HOME}/zig/zig" "${CARGO_HOME}/bin/zig"
          fi

          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            RUSTC_WRAPPER="" cargo install --locked cargo-zigbuild
          fi

      - name: Build static musl binaries (x86_64 & aarch64) and package tarballs
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          rm -rf dist dist-docker
          mkdir -p dist dist-docker/amd64 dist-docker/arm64

          build_target() {
            local target="$1"
            local docker_arch="$2"

            echo "=== Building static musl binaries for ${target} ==="
            cargo zigbuild --release --locked --target "${target}" \
              --bin osprey \
              --bin osprey-keygen

            # Stage osprey binary for multi-arch Distroless image
            cp "target/${target}/release/osprey" "dist-docker/${docker_arch}/osprey"
            chmod 0755 "dist-docker/${docker_arch}/osprey"

            # Package release archives for osprey and osprey-keygen
            for bin in osprey osprey-keygen; do
              local archive_dir="${bin}-${TAG}-${target}"
              mkdir -p "dist/${archive_dir}"
              cp "target/${target}/release/${bin}" "dist/${archive_dir}/${bin}"
              cp EULA.md SUPPORT.md "dist/${archive_dir}/"
              chmod 0755 "dist/${archive_dir}/${bin}"
              tar -C dist -czf "dist/${archive_dir}.tar.gz" "${archive_dir}"
              (cd dist && sha256sum "${archive_dir}.tar.gz" > "${archive_dir}.tar.gz.sha256")
              rm -rf "dist/${archive_dir}"
            done
          }

          build_target "x86_64-unknown-linux-musl" "amd64"
          build_target "aarch64-unknown-linux-musl" "arm64"

          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          echo "=== Generated SHA256SUMS ==="
          cat dist/SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ospreydb/osprey
          tags: |
            type=match,pattern=^(?:pro-)?v(.*),group=1
            type=match,pattern=^(?:pro-)?v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest

      - name: Build and push multi-arch Distroless image (ghcr.io/ospreydb/osprey)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Verify Distroless compressed image size (< 25 MB per arch)
        run: |
          set -euo pipefail
          IMAGE_TAG="$(echo "${{ steps.docker_meta.outputs.tags }}" | head -n 1)"
          echo "Inspecting pushed manifest: ${IMAGE_TAG}"
          docker buildx imagetools inspect --raw "${IMAGE_TAG}" | python3 -c '
          import json, subprocess, sys

          MAX_BYTES = 25 * 1024 * 1024
          index = json.load(sys.stdin)
          image_repo = sys.argv[1].rsplit(":", 1)[0]

          manifests = index.get("manifests", [])
          if not manifests:
              print("No multi-arch manifests found in index", file=sys.stderr)
              sys.exit(1)

          for entry in manifests:
              platform = entry.get("platform", {})
              os_name = platform.get("os", "unknown")
              arch = platform.get("architecture", "unknown")
              if arch == "unknown":
                  continue
              digest = entry["digest"]
              raw = subprocess.check_output(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", f"{image_repo}@{digest}"],
                  text=True,
              )
              manifest = json.loads(raw)
              total_bytes = manifest.get("config", {}).get("size", 0) + sum(
                  layer.get("size", 0) for layer in manifest.get("layers", [])
              )
              total_mb = total_bytes / (1024 * 1024)
              print(f"{os_name}/{arch}: {total_mb:.2f} MB ({total_bytes} bytes)")
              if total_bytes >= MAX_BYTES:
                  print(
                      f"ERROR: {os_name}/{arch} image exceeds 25 MB limit ({total_mb:.2f} MB)",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          ' "${IMAGE_TAG}"

      - name: Clean temporary Docker staging directory
        if: always()
        run: rm -rf dist-docker

      - name: Publish private GitHub Release with binaries and SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OspreyDB ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS

      - name: Publish public osprey server tarballs to ospreydb/osprey-engine release
        env:
          GH_TOKEN: ${{ secrets.OSPREY_ENGINE_TOKEN || secrets.OSPREY_CORE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::OSPREY_ENGINE_TOKEN / OSPREY_CORE_TOKEN not set; skipping public release upload to ospreydb/osprey-engine."
            exit 0
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::gh CLI not installed on runner; skipping public release upload to ospreydb/osprey-engine."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          (cd dist && sha256sum osprey-*.tar.gz > osprey-SHA256SUMS)
          if gh release view "${TAG}" --repo ospreydb/osprey-engine >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              dist/osprey-*.tar.gz \
              dist/osprey-*.tar.gz.sha256 \
              dist/osprey-SHA256SUMS \
              --repo ospreydb/osprey-engine \
              --clobber
          else
            gh release create "${TAG}" \
              dist/osprey-*.tar.gz \
              dist/osprey-*.tar.gz.sha256 \
              dist/osprey-SHA256SUMS \
              --repo ospreydb/osprey-engine \
              --title "OspreyDB ${TAG}" \
              --generate-notes
          fi

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Clean temporary Git credential rewrite
        if: always()
        run: |
          git config --global --name-only --get-regexp '^url\..*github\.com/ospreydb/osprey-engine\.insteadOf$' \
            | xargs -r -n1 git config --global --unset-all || true
