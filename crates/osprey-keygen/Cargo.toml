[package]
name = "osprey-keygen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Private developer CLI for issuing Ed25519-signed OSPREY-PRO-v1 offline commercial licenses"

[[bin]]
name = "osprey-keygen"
path = "src/main.rs"

[dependencies]
ospreydb = { path = "../ospreydb" }
base64.workspace = true
clap.workspace = true
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
